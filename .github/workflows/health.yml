name: Extractor health
on:
  schedule:
    - cron: '29 4 * * *'
  workflow_dispatch:
concurrency:
  group: index-durable-state
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
  actions: write
  issues: write
jobs:
  health:
    if: github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/run.yml
    with:
      mode: health
      operation: all
      initialize_state: false
    secrets: inherit
