name: Probe advertised agency feeds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing project dependencies
        run: python -m pip install .
      - name: Diagnose only explicitly advertised public agency resources
        run: python scripts/probe_agency_feeds.py --output probe-artifacts/agency-feeds.json
      - name: Publish the observation report only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agency-feeds-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: probe-artifacts/agency-feeds.json
          if-no-files-found: warn
          retention-days: 1
