name: Probe Idealista public browser access

on:
  workflow_dispatch:
    inputs:
      browser_mode:
        description: 'Chromium estándar: sin ventana o con pantalla virtual Xvfb'
        type: choice
        options: [headless, headed]
        default: headless
      navigation_mode:
        description: 'Acceso directo o recorrido por enlaces desde la portada'
        type: choice
        options: [direct, via_home]
        default: direct
      browser_engine:
        description: 'Motor estándar de Playwright'
        type: choice
        options: [chromium, firefox]
        default: chromium

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NAVIGATION_MODE: ${{ inputs.navigation_mode }}
      BROWSER_ENGINE: ${{ inputs.browser_engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated probe dependencies
        run: python -m pip install . 'playwright==1.63.0'
      - name: Install selected browser engine on this runner
        run: |
          case "$BROWSER_ENGINE" in chromium|firefox) ;; *) exit 2 ;; esac
          python -m playwright install --with-deps "$BROWSER_ENGINE"
      - name: Observe one public page with a clean headless browser context
        if: ${{ inputs.browser_mode == 'headless' }}
        run: |
          args=(--browser "$BROWSER_ENGINE" --output probe-artifacts/report.json)
          if [[ "$NAVIGATION_MODE" == 'via_home' ]]; then args+=(--via-home); fi
          timeout --signal=TERM --kill-after=5s 75s python scripts/probe_idealista.py "${args[@]}"
      - name: Observe one public page with a clean headed browser context
        if: ${{ inputs.browser_mode == 'headed' }}
        run: |
          args=(--browser "$BROWSER_ENGINE" --headed --output probe-artifacts/report.json)
          if [[ "$NAVIGATION_MODE" == 'via_home' ]]; then args+=(--via-home); fi
          timeout --signal=TERM --kill-after=5s 75s xvfb-run --auto-servernum python scripts/probe_idealista.py "${args[@]}"
      - name: Publish observation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: idealista-browser-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: probe-artifacts/report.json
          if-no-files-found: warn
          retention-days: 1
