name: Probe published public sources

on:
  workflow_dispatch:
    inputs:
      source_set:
        description: Fixed published resources to observe once
        type: choice
        required: true
        default: default
        options:
          - default
          - idealista_directories

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install .
      - name: Diagnose the selected published resources once
        env:
          PROBE_SOURCE_SET: ${{ inputs.source_set }}
        run: python scripts/probe_published_sources.py --source-set "$PROBE_SOURCE_SET" --output probe-artifacts/report.json
      - name: Publish the observation report only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: published-sources-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: probe-artifacts/report.json
          if-no-files-found: warn
          retention-days: 1
