[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "index-scrapers"
version = "0.1.0"
description = "Extractores y cola persistente de Index"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "selectolax>=0.4,<0.5"]

[project.optional-dependencies]
images = ["Pillow>=11,<13"]
test = ["pytest>=8,<10"]

[project.scripts]
index-scrapers = "index_scrapers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"
